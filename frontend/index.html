<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Sonify — Ad-free music streaming web player with live catalog, synced lyrics, and custom playlists." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sonify" />
  <title>Sonify — Ad-Free Music Streaming</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/lyrics.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation and library"></aside>

    <!-- Main Center Workspace -->
    <div class="main-panel">
      <header id="topbar" class="topbar">
        <div class="topbar-left">
          <div class="nav-history-btns">
            <button id="btn-nav-back" class="icon-circle-btn" title="Go back" aria-label="Go back"></button>
            <button id="btn-nav-forward" class="icon-circle-btn" title="Go forward" aria-label="Go forward"></button>
          </div>
          <div class="topbar-search-wrap" role="search">
            <span class="search-icon-slot" id="topbar-search-icon"></span>
            <input
              id="global-search-input"
              class="topbar-search-input"
              type="search"
              placeholder="What do you want to play? (Press /)"
              autocomplete="off"
              spellcheck="false"
              aria-label="Search songs, artists, and albums"
            />
            <button id="global-search-clear" class="search-clear-btn hidden" title="Clear search" aria-label="Clear search">&times;</button>
          </div>
        </div>
        <div class="topbar-right">
          <div class="region-switch" role="group" aria-label="Catalog region">
            <button class="region-btn active" data-region="global">Global</button>
            <button class="region-btn" data-region="vn">Vietnam</button>
          </div>
          <span class="adfree-pill" title="Zero audio ads, zero banner ads, zero trackers">
            <span class="adfree-dot"></span>Ad-Free
          </span>
        </div>
      </header>

      <div id="offline-banner" class="offline-banner hidden" role="status">
        <span class="offline-banner-text">
          Offline Showcase Mode — Upstream music APIs are currently unreachable. Enjoy curated demo tracks, synced lyrics, and full playlist management locally.
        </span>
        <button id="btn-retry-online" class="btn-subtle btn-xs">Retry Online</button>
      </div>

      <main id="main-content" class="main-content" tabindex="-1"></main>
    </div>

    <!-- Right Side Drawer (Queue / Synced Lyrics) -->
    <aside id="right-drawer" class="right-drawer hidden" aria-label="Now playing queue and lyrics"></aside>

    <!-- Persistent Bottom Player Bar -->
    <footer id="player-bar" class="player-bar" aria-label="Audio player controls"></footer>

    <!-- Mobile Bottom Navigation -->
    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>

  <!-- Overlays: Context Menu, Modal Root, Toast Container -->
  <div id="context-menu-root" class="context-menu-root hidden" role="menu"></div>
  <div id="modal-root" class="modal-root hidden" aria-modal="true" role="dialog"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <!-- Hidden HTML5 Media Element (decodes both progressive video/mp4 AAC and audio/* across all browsers) -->
  <video id="audio-engine" preload="auto" playsinline style="display:none;width:0;height:0;position:absolute;pointer-events:none" aria-hidden="true"></video>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
