name: Sonify
options:
  bundleIdPrefix: com.sonify
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Sonify:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sonify
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonify.music
        PRODUCT_NAME: Sonify
        INFOPLIST_FILE: Sonify/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - SonifyTests
      gatherCoverageData: false

  SonifyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SonifyTests
    dependencies:
      - target: Sonify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonify.music.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sonify.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sonify"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
