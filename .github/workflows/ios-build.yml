name: Sonify iOS Build, Test & TestFlight

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Build signed App Store IPA and upload to TestFlight / App Store Connect (requires Apple secrets)"
        type: boolean
        required: false
        default: false

jobs:
  build-and-test:
    name: Build, XCTest & Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Validate & generate Xcode project with XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml

      - name: Validate App Store Plists & 1024x1024 RGB AppIcon (Zero Alpha)
        run: |
          python3 - <<'PY'
          import plistlib, struct
          from pathlib import Path

          info = plistlib.loads(Path("ios/Sonify/Info.plist").read_bytes())
          assert "audio" in info.get("UIBackgroundModes", []), "Missing background audio mode"
          assert info.get("ITSAppUsesNonExemptEncryption") is False, "ITSAppUsesNonExemptEncryption must be false"

          priv = plistlib.loads(Path("ios/Sonify/Resources/PrivacyInfo.xcprivacy").read_bytes())
          assert priv.get("NSPrivacyTracking") is False, "NSPrivacyTracking must be false"

          icon_raw = Path("ios/Sonify/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png").read_bytes()
          w, h, bit_depth, color_type = struct.unpack(">IIBB", icon_raw[16:26])
          assert (w, h, bit_depth, color_type) == (1024, 1024, 8, 2), (
              f"AppIcon must be 1024x1024 8-bit RGB (color_type=2, no alpha), got {(w, h, bit_depth, color_type)}"
          )
          print("Validated Info.plist, PrivacyInfo.xcprivacy, and 1024x1024 RGB AppIcon.png")
          PY

      - name: Resolve available iPhone Simulator
        id: sim
        run: |
          SIM_ID=$(python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devices in sorted(data.get("devices", {}).items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for dev in devices:
                  if dev.get("isAvailable") and "iPhone" in dev.get("name", ""):
                      candidates.append((runtime, dev["name"], dev["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulator found")
          print(candidates[0][2])
          PY
          )
          echo "Selected Simulator UDID: $SIM_ID"
          echo "udid=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: Run XCTest Suite on iOS Simulator
        run: |
          xcodebuild test \
            -project ios/Sonify.xcodeproj \
            -scheme Sonify \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Unsigned Release Device .app & Package Sonify-unsigned.ipa
        run: |
          xcodebuild build \
            -project ios/Sonify.xcodeproj \
            -scheme Sonify \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Sonify.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -r -y Sonify-unsigned.ipa Payload)
          ls -lh build/Sonify-unsigned.ipa

      - name: Upload Unsigned IPA Artifact (For Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: Sonify-unsigned-ipa
          path: build/Sonify-unsigned.ipa
          retention-days: 14

  release-testflight:
    name: Signed Archive & TestFlight Upload
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight == true
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required App Store Connect secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          for var in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret $var for signed TestFlight upload"
              exit 1
            fi
          done

      - name: Select newest installed Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Import Distribution Certificate & Provisioning Profile
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/sonify-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$RUNNER_TEMP/sonify.mobileprovision"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          BUNDLE_ID="${IOS_BUNDLE_ID:-com.sonify.music}"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Archive & Export Signed App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUNDLE_ID="${{ steps.signing.outputs.bundle_id }}"
          PROFILE_NAME="${{ steps.signing.outputs.profile_name }}"

          xcodebuild archive \
            -project ios/Sonify.xcodeproj \
            -scheme Sonify \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Sonify.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/Sonify.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/Export

      - name: Upload Signed IPA to TestFlight / App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"

          IPA_FILE=$(ls build/Export/*.ipa | head -n 1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup Signing Keychain & API Keys
        if: always()
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}" 2>/dev/null || true
          rm -rf "$HOME/.private_keys" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/sonify.mobileprovision" "$RUNNER_TEMP/profile.plist"
